{% extends "base.html" %}
{% block title %}Projects - delegate{% endblock %}
{% block body %}
<main class="page">
  <h1>Projects</h1>
  <form class="filters" id="filters" method="get" action="/" role="search"
        hx-get="/" hx-target="#projects" hx-swap="innerHTML" hx-push-url="true" hx-sync="this:replace"
        hx-trigger="input delay:250ms from:#q, change from:#state-chips, submit">
    <label class="searchbox"><span class="sr">Search projects by name, path or key</span>
      <input id="q" type="search" name="q" value="{{ q }}" placeholder="Search name, path or key" autocomplete="off"></label>
    <fieldset id="state-chips" class="chips">
      <legend class="sr">Show projects in these states</legend>
      {% for s in PROJECT_STATES %}
      <label class="chipf st-{{ s }}"><input type="checkbox" name="state" value="{{ s }}"{% if s in selected %} checked{% endif %}><span>{{ STATE_LABELS[s] }}</span></label>
      {% endfor %}
    </fieldset>
    <noscript><button type="submit" class="primary">Filter</button></noscript>
    <a class="clear" href="/">Clear</a>
  </form>
  <div id="projects" aria-live="polite">{% include "_projects.html" %}</div>
</main>
{% endblock %}
