{% macro prio(p) %}<span class="prio p{{ p.value }}" title="Priority P{{ p.value }}">P{{ p.value }}</span>{% endmacro %}

{% macro who(name) %}{% if name %}<span class="chip {{ 'human' if name == 'human' else 'agent' }}">{% if name != 'human' %}🤖 {% endif %}{{ name }}</span>{% endif %}{% endmacro %}

{% macro status_pill(s) %}<span class="pill s-{{ s.value }}">{{ COLUMN_LABELS[s.value] }}</span>{% endmacro %}

{% macro task_link(key, t) %}
<a class="tl" href="/p/{{ key }}/t/{{ t.ref }}" hx-get="/p/{{ key }}/t/{{ t.ref }}" hx-target="#drawer-body" hx-push-url="true">
  <b>{{ t.ref }}</b> {{ t.title }}</a>
{% endmacro %}
